<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势手写签名生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>手势手写签名生成器</h1>
        
        <div class="instruction">
            <p><strong>使用说明：</strong>将食指和拇指捏合在一起即可开始写字，松开停止。</p>
        </div>

        <div class="video-container">
            <video id="webcam" class="webcam" autoplay playsinline></video>
            <canvas id="canvas" class="canvas"></canvas>
            <canvas id="signature" class="signature"></canvas>
        </div>

        <div class="api-section">
            <label for="apiKey">火山引擎API密钥：</label>
            <input type="password" id="apiKey" placeholder="请输入API密钥">
        </div>

        <div class="model-section">
            <label for="ocrModel">VLM模型：</label>
            <select id="ocrModel">
                <option value="seed-2.0-pro">Seed 2.0 Pro</option>
            </select>
            <label for="genModel">签名生成模型：</label>
            <select id="genModel">
                <option value="seeddream-latest">SeedDream Latest</option>
            </select>
        </div>

        <div class="controls">
            <button id="startBtn">开始</button>
            <button id="clearBtn">清除</button>
            <button id="saveBtn">保存原始签名</button>
            <button id="generateBtn" disabled title="请先输入火山引擎API密钥">生成美化签名</button>
        </div>

        <div class="process-steps" id="processSteps" style="display: none;">
            <h3>生成流程</h3>
            <div class="step" id="step1">
                <span class="step-number">1</span>
                <div class="step-content">
                    <span class="step-text">调用 VLM 模型识别文字...</span>
                    <div class="step-detail" id="step1Detail"></div>
                </div>
                <span class="step-status">⏳</span>
            </div>
            <div class="step" id="step2">
                <span class="step-number">2</span>
                <div class="step-content">
                    <span class="step-text">识别结果：<span id="recognizedText">-</span></span>
                </div>
                <span class="step-status" id="step2Status">⏳</span>
            </div>
            <div class="step" id="step3">
                <span class="step-number">3</span>
                <div class="step-content">
                    <span class="step-text">调用 SeedDream 模型生成签名...</span>
                    <div class="step-detail" id="step3Detail"></div>
                </div>
                <span class="step-status">⏳</span>
            </div>
        </div>

        <div class="comparison" id="comparisonSection" style="display: none;">
            <h3>签名对比</h3>
            <div class="comparison-images">
                <div class="image-box">
                    <h4>原始签名</h4>
                    <img id="originalSignature" alt="原始签名">
                </div>
                <div class="image-box">
                    <h4>美化签名</h4>
                    <img id="generatedSignature" alt="美化签名">
                    <button id="saveGeneratedBtn">保存美化签名</button>
                </div>
            </div>
        </div>

        <div class="status">
            <p id="statusText">准备就绪，点击开始按钮启动相机</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
